# Fixed SmallG1OnlineV1_5 opponent for the gen1ou expert_curated specialist
# validator (SmallG1OnlineV2).
#
# The trainee plays expert_curated (set via --val_team_set); the fixed opponent
# is SmallG1OnlineV1_5 (this run's starting point, @ its default ckpt 400)
# drawing teams from hl_05_26 to match the training opponent distribution. This
# measures whether the run improves over its own initialization.
defaults:
  team_set: hl_05_26
  battle_backend: metamon
  checkpoints: [null]
  temperatures: [1.0]
  num_agents: 1

agents:
  SmallG1OnlineV1_5:
    model_name: SmallG1OnlineV1_5
