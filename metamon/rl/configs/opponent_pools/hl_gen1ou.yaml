# High-level gen1ou opponent pool for online RL training collection.
# Each agent samples a checkpoint below its default (null = default/best) and a temperature.
# num_agents (defaults or per-agent) duplicates pool rows → higher sample weight.
# Verify checkpoint epochs exist on HuggingFace before long runs.
defaults:
  team_set: "@schedule"
  battle_backend: metamon
  checkpoints: [null]
  temperatures: [1.0, 1.25, 1.5, 1.75, 2.0]
  num_agents: 1

agents:
  TaurosV0:
    model_name: TaurosV0
    num_agents: 2
    # default ckpt 62; verify epochs exist on HF / adjust
    checkpoints: "range(50, 63, 2)"

  Kakuna:
    model_name: Kakuna
    num_agents: 2
    checkpoints: "range(24, 35, 2)"

  Alakazam:
    model_name: Alakazam
    checkpoints: "range(2, 9, 2)"

  SyntheticRLV2:
    model_name: SyntheticRLV2
    checkpoints: "range(36, 49, 2)"

  V2ADataAblation:
    model_name: V2AGroupedV2DataAblation
    checkpoints: "range(74, 91, 2)"

  Superkazam:
    model_name: Superkazam
    checkpoints: "range(38, 51, 2)"

  Kadabra3:
    model_name: Kadabra3
    checkpoints: "range(10, 21, 2)"

  # PSRO self-play from the v1 run (gl-era, ~1250 effective epochs on gl
  # teams). Pin to gl_05_26 so this mature gl-trained self plays its home
  # composition against the learner, instead of being farmed on smogon teams
  # under @schedule (where it misplays). A gl-specialist peer opponent.
  MiniOnlinePsroV0:
    model_name: MiniOnlinePsroV0
    num_agents: 1
    team_set: gl_05_26
    checkpoints: [550]

  # PSRO self-play from the v1.3 run (competitive/smogon curriculum). Three
  # specialists, each pinned to the teamset where it is competent, so the league
  # forces the learner to beat strong peers on BOTH gl and smogon compositions
  # rather than only farming the fixed external gl-era models on @schedule.
  # Agent names use underscore suffixes (not hyphens) so the trajectory-filename
  # parser's longest-prefix match on '-' can't confuse them with each other.
  #
  # Smogon specialist: latest smogon-trained self on the current @schedule
  # (phase 3/4: smogon-heavy). The true self-play peer on the target dist.
  MiniOnlinePsroV1_3:
    model_name: MiniOnlinePsroV1_3
    num_agents: 1
    checkpoints: [1760]
  # GL specialist: early gl-era self from this run (epoch 1140, trained almost
  # entirely on gl_05_26), pinned to gl where it is competent.
  MiniOnlinePsroV1_3GL:
    model_name: MiniOnlinePsroV1_3
    num_agents: 1
    team_set: gl_05_26
    checkpoints: [1140]
  # Pass2 specialist: mid-specialization self on the broad smogon_pass2 set
  # (epoch 1500, partway into the smogon curriculum).
  MiniOnlinePsroV1_3P2:
    model_name: MiniOnlinePsroV1_3
    num_agents: 1
    team_set: smogon_pass2
    checkpoints: [1500]
