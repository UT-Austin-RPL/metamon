# High-level gen1ou opponent pool for online RL training collection.
# Each agent samples a checkpoint below its default (null = default/best) and a temperature.
# num_agents (defaults or per-agent) duplicates pool rows → higher sample weight.
# Verify checkpoint epochs exist on HuggingFace before long runs.
defaults:
  team_set: gl_05_26
  battle_backend: metamon
  checkpoints: [null]
  temperatures: [1.0, 1.25, 1.5, 1.75, 2.0]
  num_agents: 1

agents:
  TaurosV0:
    model_name: TaurosV0
    num_agents: 2
    # default ckpt 62; verify epochs exist on HF / adjust
    checkpoints: "range(50, 63, 2)"

  Kakuna:
    model_name: Kakuna
    num_agents: 2
    checkpoints: "range(24, 35, 2)"

  Alakazam:
    model_name: Alakazam
    checkpoints: "range(2, 9, 2)"

  SyntheticRLV2:
    model_name: SyntheticRLV2
    checkpoints: "range(36, 49, 2)"

  V2ADataAblation:
    model_name: V2AGroupedV2DataAblation
    checkpoints: "range(74, 91, 2)"

  Superkazam:
    model_name: Superkazam
    checkpoints: "range(38, 51, 2)"

  Kadabra3:
    model_name: Kadabra3
    checkpoints: "range(10, 21, 2)"

  # PSRO self-play expansion: a competitive past self from the current online
  # RL run (mini_online_psro_v1). Registered as MiniOnlinePsroV0 in pretrained.py.
  # Selected by TaurosV0 eval: epoch 550 scored 0.56 win rate / 110.9 return
  # (100 battles, competitive teams) — right at the learner's current level.
  # Epoch 0 was a first-epoch transient (0.01) and is excluded; epoch 250 (0.41)
  # is a weaker optional add. One aggregate agent row (num_agents=1); PSRO-Lite
  # tracks one per-agent win rate for this row. To refresh as the run saves more
  # competitive checkpoints, bump the epoch below and relaunch the collector.
  MiniOnlinePsroV0:
    model_name: MiniOnlinePsroV0
    num_agents: 1
    checkpoints: [550]
